name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build and test
        run: gradle clean build

      - name: Verify distributable mod JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'planet-lib-*.jar' ! -name '*sources.jar' ! -name '*dev.jar' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fx 'fabric.mod.json'
          jar tf "$jar_file" | grep -Fx 'com/planetstudios/planetlib/PlanetLib.class'
          echo "Verified: $jar_file"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planet-lib-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
          if-no-files-found: error
          retention-days: 14
